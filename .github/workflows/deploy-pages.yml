name: Deploy Homekeeper to GitHub Pages

# Publishes the app (static files at the repo root) to GitHub Pages
# on every push, and can also be run manually from the Actions tab.
on:
  push:
    branches:
      - claude/ios-house-management-app-1eh7f8
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn GitHub Pages on automatically if it isn't already,
          # so no manual toggle in repo Settings is needed.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site — index.html is the entry point.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
